<!doctype html><html lang="zh-CN" data-theme="azure"><head><meta charset="utf-8"><base href="../../">
<title>Capability toolbar — isolated regression</title>
<link rel="stylesheet" href="theme/variables.css">
<link rel="stylesheet" href="components/panels/panels-schedules.css">
<link rel="stylesheet" href="components/panels/panels-capabilities.css">
<link rel="stylesheet" href="components/panels/panels-capability-plugins.css">
<link rel="stylesheet" href="components/panels/panels-capability-mcp.css">
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-ui);color:var(--ink);background:var(--bg-0)}
#capPanel{inset:0;transform:none;width:100%;height:100vh;max-height:none;border:0;border-radius:0;box-shadow:none}#capPanel>.sch-head{display:none}</style>
</head><body>
<script>
window.errors=[];window.notices=[];window.refreshCalls=0;window.writes=0;
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
window.petSay=message=>notices.push(message);
window.catalog={skills:Array.from({length:10},(_,i)=>({name:'fixture-'+i,enabled:true,available:false})),mcpTemplates:[],summary:{mcpReady:true}};
window.SoduWorkAPI={capabilityCatalog:async()=>structuredClone(catalog),myMcpServers:async()=>({company:[],personal:[],enabledCompany:['fixture-a','fixture-b','fixture-c']}),
 setMySkills:async()=>{writes++},refreshMySkills:async()=>{refreshCalls++;if(window.holdRefresh)await new Promise(resolve=>window.finishRefresh=()=>{window.holdRefresh=false;resolve()});if(window.failRefresh)throw Error('模拟本机目录暂不可用');return structuredClone(catalog)}};
const renderStub=(content,title)=>{content.innerHTML='<section class="cap-section"><div class="cap-section-head"><b>'+title+'</b><span>隔离页面 · 不连接真实服务</span></div><div class="cap-empty">工具栏交互验证</div></section>'};
window.SoduWorkCapabilityPlugins={load:async()=>({items:[],submissions:[]}),snapshot:()=>({items:[],submissions:[]}),managedCount:()=>33,marketCount:()=>26,hasPendingReview:()=>false,revision:()=> 'fixture',render:content=>renderStub(content,'我的插件')};
window.SoduWorkCapabilityDirectory={appCount:()=>3,renderApps:content=>renderStub(content,'连接外部系统'),renderMarket:content=>renderStub(content,'企业能力市场')};
</script>
<script src="components/panels/skill-catalog-sync.js"></script>
<script src="components/panels/plugin-catalog-sync.js"></script>
<script src="components/panels/panels-capability-mcp.js"></script>
<script src="components/panels/plugin-presentation.js"></script>
<script src="core/connector-brand.js"></script>
<script src="components/panels/connector-directory.js"></script>
<script src="components/panels/connector-selection.js"></script>
<script src="components/panels/connector-config.js"></script>
<script src="components/panels/connector-auth.js"></script>
<script src="components/panels/connector-editor.js"></script>
<script src="components/panels/panels-capability-editors.js"></script>
<script src="components/panels/panels-capabilities.js"></script>
<script>
window.requests=[];window.failProbe=false;window.saved=[];
catalog.mcpTemplates=[{key:'connector-figma',name:'Figma',configurable:true,description:'读取设计文件、查看项目与评论',connectionFields:[{key:'FIGMA_TOKEN',label:'访问令牌',required:true,secret:true},{key:'ALLOW_WRITES',label:'允许写入',type:'boolean'}]}];
Object.assign(SoduWorkAPI,{
 taskStorageKey:()=> 'fixture-owner',
 preflightMyMcpServer:async spec=>{requests.push({action:'preflight',spec});return{ok:true}},
 probeMyMcpServer:async spec=>{requests.push({action:'probe',spec});if(window.holdProbe)await new Promise(resolve=>window.finishProbe=resolve);return failProbe?{ok:false,error:'授权已失效'}:{ok:true,authenticationTested:true,tools:['read']}},
 saveMyMcpServer:async spec=>{requests.push({action:'save',spec});saved.push(spec);return{personal:saved}},
 capabilityCatalog:async()=>structuredClone(catalog)
});
catalog.mcpTemplates.push({key:'connector-google-drive',name:'Google Drive',configurable:true,description:'搜索与读取云端文件',connectionFields:[{key:'GOOGLE_ACCESS_TOKEN',label:'访问令牌',required:true,secret:true},{key:'ALLOW_WRITES',label:'允许写入',type:'boolean'}]});
window.oauthState='connected';window.oauthCancelled=0;window.oauthAvailable=true;
window.soduWorkAPI={openExternal:async()=>{}};
Object.assign(SoduWorkAPI,{
 connectorOAuthProviders:async()=>({providers:[{id:'api',available:true,redirectUri:'https://hub.example.com/api/v1/mcp-servers/oauth/callback'},{id:'google-drive',label:'Google Drive',available:oauthAvailable,tokenField:'GOOGLE_ACCESS_TOKEN'}]}),
 startConnectorOAuth:async()=>({attemptId:'fixture-attempt',authorizationUrl:'https://accounts.google.com/o/oauth2/v2/auth'}),
 connectorOAuthStatus:async()=>({state:oauthState,oauth:{provider:'google-drive',connectionId:'fixture-binding'}}),
 cancelConnectorOAuth:async()=>{oauthCancelled++}
});
openCapabilityPanel();
window.openConnector=()=>document.querySelector('[data-cap-tab="connections"]').click();
</script></body></html>
