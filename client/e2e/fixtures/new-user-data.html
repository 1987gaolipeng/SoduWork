<script>
window.fixtureErrors=[];window.fixtureCalls=[];
addEventListener('error',e=>fixtureErrors.push(e.message));
addEventListener('unhandledrejection',e=>fixtureErrors.push(String(e.reason)));
window.fixtureIdentity={clientId:'new-install',user:{id:'new-user'}};
window.fixtureTasks=[];window.holdTasks=false;
window.soduWorkAPI={deviceAuthBootstrap:async()=>({ok:true,stored:true,session:'isolated-session',expiresIn:1800,...fixtureIdentity})};
window.fetch=async(url,options={})=>{
 const route=new URL(url).pathname;
 fixtureCalls.push({route,method:options.method||'GET'});
 if((options.method||'GET')!=='GET')throw Error('Unexpected mutation in new-user UI fixture');
 let value={};
 if(route==='/api/v1/tasks'){
   if(holdTasks)return new Promise(resolve=>{window.releaseTasks=items=>resolve({ok:true,status:200,text:async()=>JSON.stringify(items)})});
   value=fixtureTasks;
 }else if(route==='/api/v1/projects')value=[];
 else if(route!=='/api/v1/config')throw Error('Unexpected isolated request: '+route);
 return {ok:true,status:200,text:async()=>JSON.stringify(value)};
};
window.WorkspaceHost={open:()=>{}};
window.WorkEntrySheet={openTask:()=>{}};
window.openDetailEntry=()=>{};
window.petSay=()=>{};window.expandForOverlay=()=>{};window.shrinkFromOverlay=()=>{};window.makeDraggable=()=>{};
window._fmtDate=value=>new Date(value).toLocaleDateString('zh-CN');
window.User={id:'legacy-browser-id'};
localStorage.setItem('soduwork_work_task_ops_v1',JSON.stringify([{id:'old-task',kind:'put',token:'old',data:{title:'旧版示例任务',status:'todo'}}]));
localStorage.setItem('soduwork_work_tasks_v5',JSON.stringify([{id:'old-task',title:'旧版示例任务',status:'todo'}]));
</script>

<script>
window.fixtureOpen=view=>{
 document.documentElement.dataset.workspaceView=view;
 openTaskCenter();
};
document.querySelector('#showRequirements').onclick=()=>fixtureOpen('history');
window.fixtureReady=(async()=>{
 await SoduWorkAPI.registerClient();await Store.init();await Store._flushTaskOps();fixtureOpen('history');
})();
