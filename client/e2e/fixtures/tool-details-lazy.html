<script>
window.errors=[]; addEventListener('error',e=>errors.push(e.message));
const noop=()=>{};
window.ctx={_ref:'detail-fixture',_viewEpoch:1,_sessionOptions:{},_collabTasks:new Map(),_collabEntries:()=>[],
  _openTool:new Set(),_openThink:new Set(),_closedThink:new Set(),_openToolGroup:new Set(),_pendingAttachmentNames:[],
  _outs:[],_api:()=>soduWorkAPI.conversationSession,_messageWindowSize:80,
  _syncThinkingClock:noop,_renderQueue:noop,_renderTaskStartPrompt:noop,_syncSlowStatusTicker:noop,
  _thinkingStatusHtml:()=>'',_ensureHlCss:noop,_ensureCollabView:noop,_conversationDraftText:()=>'',
  _paintBar:noop,_rememberConversationDraft:noop,_runtimeBusy:()=>true,esc:ChatTools.esc,
  _snap:{status:'idle',tools:[],messages:[]}};
const bindings=ChatComposerBindings.create(ctx);ctx._mount=bindings._mount;ctx._mount();
window.renderer=ChatMessageRenderer.create(ctx);ctx._render=renderer._render;
window.metrics={highlight:0,diff:0,rebuilds:0};
const highlight=hljs.highlight, diff=Diff.createTwoFilesPatch, patch=ChatTools.patchList;
hljs.highlight=(...args)=>{metrics.highlight++;return highlight(...args)};
Diff.createTwoFilesPatch=(...args)=>{metrics.diff++;return diff(...args)};
ChatTools.patchList=(...args)=>{metrics.rebuilds++;return patch(...args)};
window.showSnapshot=snapshot=>{ctx._snap=snapshot;renderer._render();};
</script>
