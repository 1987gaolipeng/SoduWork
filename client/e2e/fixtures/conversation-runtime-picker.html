<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="../../"><title>会话内切换 · 组件验证</title>
<link rel="stylesheet" href="theme/variables.css">
<link rel="stylesheet" href="components/panels/work-composer.css">
<link rel="stylesheet" href="components/panels/chat-session-controls.css">
<link rel="stylesheet" href="components/panels/panels-chat.css">
<style>*{box-sizing:border-box}body{margin:0;font:14px var(--font-ui);background:var(--bg-1);color:var(--ink)}main{height:100vh;max-width:850px;margin:auto;padding:24px;display:flex;flex-direction:column}.history{flex:1;line-height:1.8;padding:36px 12px}#old{margin:0}</style>
</head><body><main><div class="history">请继续完善这个项目。<p>原有对话和文件会保留，可以在输入框右下角切换 Agent。</p></div><div id="nchatQueue"></div><div id="old"></div></main>
<script src="components/panels/agent-brand.js"></script>
<script src="components/panels/work-composer.js"></script>
<script src="components/panels/chat-session-controls.js"></script>
<script src="components/panels/chat-runtime-picker.js"></script>
<script src="components/panels/chat-composer-controls.js"></script>
<script>
window.errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
window.runtimes=[['pi','Pi'],['opencode','OpenCode'],['qwen','Qwen Code'],['harness2','Google Harness²']].map(([id,displayName])=>({id,displayName,modelMode:'managed'}));
window.state={ref:'same-conversation',adapterId:'pi',displayName:'Pi',selection:{name:'a',model:{id:'a',label:'模型 A'}}};
window.calls=[];window.notices=[];window.fail=false;window.modelGate=null;window.switchGate=null;window.agentManagementOpened=0;
window.openAgentsEntry=()=>{agentManagementOpened++;};
window.SoduWorkAPI={myModels:async()=>{if(modelGate)await modelGate;return{usable:[{name:'a',label:'模型 A'},{name:'b',label:'模型 B'}]}}};
window.soduWorkAPI={conversationSession:{runtimes:async()=>({ok:true,runtimes,availableRuntimes:runtimes,missing:[{id:'dsh',displayName:'DeepSeek Harness'}]}),conversationRuntimes:async()=>({ok:true,runtimes,availableRuntimes:runtimes,missing:[{id:'dsh',displayName:'DeepSeek Harness'}]}),
  selectAgent:async(ref,agentId)=>{calls.push({ref,agentId});if(switchGate)await switchGate;return fail?{ok:false,reason:'此 Agent 暂不可用'}:{ok:true,adapterId:agentId,displayName:runtimes.find(r=>r.id===agentId).displayName}},
  selectModel:async(ref,name)=>{calls.push({ref,name});return{ok:true,selection:{name,model:{id:name,label:'模型 '+name.toUpperCase()}}}}}};
WorkComposer.upgradeChat(document.querySelector('#old'));
document.querySelector('#nchatWdName').textContent='项目工作区';
window.controls=ChatComposerControls.create(document.querySelector('main'),{state:()=>state,say:text=>notices.push(text),
  runtimeSelected:r=>{state.adapterId=r.adapterId;state.displayName=r.displayName;controls.render()},
  modelSelected:s=>{state.selection=s;controls.render()},renderQueue(){},updateQueue(){}});
controls.render();window.fixtureReady=true;
</script></body></html>
