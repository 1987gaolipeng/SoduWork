<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>即用机器人</title><link rel="stylesheet" href="style.css"><body>
<main><header><span class="brand">即用实验室 <small>WORK, WITH A LITTLE WONDER.</small></span><span class="pill" id="name"></span></header>
<section class="hero"><div><span class="eyebrow" id="eyebrow"></span><h1 id="title"></h1><p id="intro"></p><div class="actions"><button class="primary" id="run">现在运行一次</button><button id="subscribe">每天 9 点自动运行</button></div><div id="status" class="action-status" role="status" aria-live="polite">正在连接 SoduWork…</div><button class="quiet" id="trial">安排一次定时试跑（3 分钟后）</button><p class="hint" id="hint">窗口关掉以后，计划仍由 SoduWork 执行。设备需要在线。</p></div><div class="machine" aria-hidden="true"><div class="glass"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="stand"><span>IDEAS IN MOTION</span><b>✦</b><div class="slot"></div></div></div></section>
<section class="grid"><div class="input-panel"><span class="step">01 / INPUT</span><h2 id="input-title">给机器人一点素材</h2><form id="seed-form"><label for="source" id="source-label">输入想法、记录或要求</label><textarea id="source" maxlength="6000" rows="6" required></textarea><button id="save-source">保存素材</button></form><p id="source-status"></p><ul id="seeds"></ul></div><div class="result-panel"><div class="result-head"><div><span class="step">02 / RESULTS</span><h2 id="result-title">等待下一次惊喜</h2></div><button id="refresh">刷新结果</button></div><div id="results" aria-live="polite"></div></div></section>
<footer><span id="footer-note">独立本机数据库 · 结果不会随窗口关闭而消失</span></footer></main>
<dialog id="schedule-dialog"><form id="schedule-form"><h2 id="schedule-title">安排一次</h2><label for="schedule-time" id="schedule-label">执行时间</label><input id="schedule-time" type="datetime-local" required><div class="actions"><button id="schedule-cancel" type="button">取消</button><button class="primary" id="schedule-confirm">确认安排</button></div></form></dialog><script src="config.js"></script><script src="soduwork-app.js"></script><script src="app.js"></script></body></html>
