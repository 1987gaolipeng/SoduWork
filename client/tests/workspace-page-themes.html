<script>
window.fixtureErrors=[];window.fixtureCalls=[];
addEventListener('error',e=>fixtureErrors.push(e.message));
addEventListener('unhandledrejection',e=>fixtureErrors.push(String(e.reason)));
window.fetch=()=>{throw Error('Network forbidden in isolated UI fixture')};
window.esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.Store={taskState:'ready'};
window.tasks=[
{id:'task-a',title:'整理新产品发布方案与交付清单',note:'保留背景与验收条件',source:'需求池',status:'todo',myRoles:['assignee'],createdAt:Date.now()},
{id:'task-b',title:'验证官网导航与移动端展示',source:'我的',status:'doing',myRoles:['executor'],createdAt:Date.now()},
{id:'task-c',title:'输出本周用户反馈简报',source:'我的',status:'done',myRoles:['creator'],createdAt:Date.now()}];
window.statusRaw=s=>'var(--s-'+s+')';
window._fmtDate=value=>new Date(value).toLocaleDateString('zh-CN');
window.WorkspaceHost={open:(...args)=>fixtureCalls.push(args)};
window.WorkEntrySheet={openTask:o=>fixtureCalls.push(['requirement',o])};
window.openDetailEntry=id=>fixtureCalls.push(['detail',id]);
window.petSay=s=>fixtureCalls.push(['notice',s]);
window.expandForOverlay=()=>{};window.shrinkFromOverlay=()=>{};window.makeDraggable=()=>{};
window._dkView='overview';window._dkBoardShellHtml=()=>'';window._dkUnmountTaskFlow=()=>{};
window.SoduWorkAPI={
 getTask:async id=>structuredClone(tasks.find(t=>t.id===id)),listAttachments:async()=>[],
 hubConfig:()=>({environment:'development'}),getProjects:async()=>[{id:'demo',name:'客户体验'}],
 listSchedules:async()=>[],listAIAgents:async()=>({agents:[]}),listRepos:async()=>[],
 capabilityCatalog:async()=>({skills:[],mcpTemplates:[],summary:{}}),
 myMcpServers:async()=>({company:[],personal:[],enabledCompany:[]}),
 getWorkReports:async()=>({period:{start:'2026-09-07',end:'2026-09-07',label:'今天'},mine:{hasMaterial:false},capability:{canManage:false}}),
 generateWorkReports:async()=>{fixtureCalls.push(['generate-brief']);return{}}
};
// Controller boundaries are mocked; each actual page creates and binds its own DOM.
window.SoduWorkSkillCatalogSync={runtimeApi:()=>null,runtimeMap:()=>new Map(),create:()=>({sync(){},stop(){},state:()=>({}),refresh:async()=>({})})};
window.SoduWorkPluginCatalogSync={create:()=>({start(){},stop(){},refresh(){},isRunning:()=>false})};
window.SoduWorkCapabilityPlugins={load:async()=>({items:[]}),snapshot:()=>({items:[],submissions:[]}),managedCount:()=>0,
hasPendingReview:()=>false,render:root=>{root.textContent='隔离样式验收：插件内容不在本次变更范围。'}};

<script>
// Only the data/office body boundary is mocked; production openAIDesk creates
// the header, binds refresh/management and controls the loading button state.
window._loadDesks=async function(){
 fixtureCalls.push(['desk-refresh']);
 if(window.holdDeskRefresh)await new Promise(resolve=>{window.finishDeskRefresh=resolve});
 document.getElementById('dkSub').textContent='1 条运行中 · 2 条需要处理';
 const live=document.getElementById('dkLiveStatus');live.classList.add('is-live');live.querySelector('b').textContent='LIVE';
};
window.fixtureOpen=function(view){
 const ids={history:'historyBoard',briefs:'briefPanel',schedules:'schPanel',skills:'capPanel',aidesk:'aiDeskPanel'};
 const open={history:openTaskCenter,briefs:openBriefsPanel,schedules:openSchedulePanel,skills:openCapabilityPanel,aidesk:openAIDesk};
 if(document.getElementById('aiDeskPanel'))closeAIDesk();
 document.documentElement.dataset.workspaceView=view;
 for(const id of new Set(Object.values(ids)))document.getElementById(id)?.style.setProperty('display','none','important');
 document.getElementById('fixtureContent').style.display=view==='briefs'?'block':'none';
 open[view]();
 if(view==='briefs')document.getElementById('fixtureContent').appendChild(document.getElementById('briefPanel'));
 document.getElementById(ids[view]).style.setProperty('display','flex','important');
 document.querySelectorAll('[data-test-view]').forEach(b=>b.classList.toggle('active',b.dataset.testView===view));
};
document.querySelectorAll('[data-test-view]').forEach(b=>b.addEventListener('click',()=>fixtureOpen(b.dataset.testView)));
fixtureOpen('history');
</script></body></html>
