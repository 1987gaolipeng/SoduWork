<script>
window.fixtureErrors=[];window.fixtureCalls=[];window.fixtureDrafts=[];
addEventListener('error',e=>fixtureErrors.push(e.message));
addEventListener('unhandledrejection',e=>fixtureErrors.push(String(e.reason)));
window.fetch=()=>{throw Error('Network forbidden in isolated fixture')};
window.petSay=s=>fixtureCalls.push(['notice',s]);
window.WorkspaceHost={open:(...args)=>fixtureCalls.push(args)};
window.SoduWorkSkillCatalogSync={runtimeApi:()=>null,runtimeMap:()=>new Map(),create:()=>({sync(){},stop(){},state:()=>({}),refresh:async()=>({})})};
window.SoduWorkPluginCatalogSync={create:()=>({start(){},stop(){},refresh(){},isRunning:()=>false})};
const stepNames=['理解规划：拆解需求并制定调研计划','开源项目调研：寻找可复用构建模块','论文调研：提炼可迁移的技术依据','创新综合：多视角交叉构思','AI 审查：证据核实与可行性评分','人工验收：挑选创意并给出方向','办结沉淀：生成完整交付材料'];
window.fixtureDraft={
 key:'product-innovation',version:'1.0.0',name:'产品创新引擎（开源项目 × 论文调研）',template:'workflow',
 description:'以开源项目与学术论文为双重证据源，完成从产品创意、技术依据到可行性评审的完整研究。',
 instructions:'先澄清目标和范围，再检索开源项目与论文；每个结论标注可核查来源。交付创新方案、引用清单与验收结论。',
 skills:['research-01','missing-retained'],mcpServers:['knowledge-base'],runtimeCapabilities:['browser'],
 entrypoints:{conversation:true,task:true,automation:true},
 inputs:[{key:'goal',label:'研究目标',type:'textarea',required:true,description:'说明业务问题与预期结果',default:'提高研发协作效率'}],
 setup:{title:'研究偏好',description:'安装时配置引用格式',preferences:[{key:'language',label:'输出语言',type:'select',default:'zh',options:[{value:'zh',label:'中文'},{value:'en',label:'English'}]}]},
 evaluationInstruction:'为企业研发团队提出一个有证据支撑的产品方向',evaluationCriteria:['结论有来源','成果包含研究报告'],
 resources:[{kind:'template',path:'templates/research.md',size:2048},{kind:'example',path:'examples/brief.md',size:1300}],
 ui:{contributions:[]},workflow:{nodes:stepNames.map((name,i)=>({key:'step_'+i,name,type:i===5?'human_review':i===6?'publish':i===4?'ai_review':'ai',dependsOn:i?['step_'+(i-1)]:[],inputs:[],outputs:[],config:{prompt:'核查资料并交付可供下游使用的结果'}}))}
};
const base={personal:false,installed:true,enabled:true,sourceKind:'enterprise',version:'1.0.0',organizationWide:true,
 entrypoints:{conversation:true,task:true,automation:true},installationState:'installed',
 capabilities:{skills:['research-01'],mcpServers:[],runtime:['files'],components:[{kind:'instructions',label:'工作说明'},{kind:'skills',label:'Skill',count:2},{kind:'inputs',label:'任务参数',count:6}],permissionSummary:{riskLevel:'low'},qualitySummary:{verified:true},resources:fixtureDraft.resources},
 workflow:stepNames.map((name,i)=>({name,type:i===5?'human_review':i===6?'publish':i===4?'ai_review':'ai'}))};
window.fixtureItems=[
 {...structuredClone(base),personal:true,sourceKind:'personal',pluginId:'personal-test',name:fixtureDraft.name,description:fixtureDraft.description},
 ...['演示文稿工坊','PDF 工具箱','会议到行动','智能体产品设计','代码修复 · 自动研发闭环','材料研读与知识综述'].map((name,i)=>({
 ...structuredClone(base),pluginId:'enterprise-'+i,name,description:['从目标、材料和数据搭建故事线，构建可直接演讲的 PowerPoint 演示文稿。','对 PDF 文件做拆分、合并、抽取与整理，并保留完整处理记录。','把会议录音、转写稿或笔记整理为忠于原文的纪要和可执行行动项。'][i%3],
 ...(i===3?{updateAvailable:true}:i===4?{enabled:false}:{}),
 }))
];
const skills=Array.from({length:42},(_,i)=>({name:'research-'+String(i+1).padStart(2,'0'),description:'检索、核查并整理研究材料；支持附带引用与证据链的团队工作方法。'}));
window.SoduWorkAPI={
 capabilityCatalog:async()=>({skills,mcpTemplates:[],summary:{}}),myMcpServers:async()=>({company:[],personal:[],enabledCompany:[]}),
 pluginCatalog:async()=>({items:fixtureItems,submissions:[],categories:[]}),mySkills:async()=>({skills}),listAIAgents:async()=>({agents:[]}),
 personalPlugin:async()=>({plugin:{localDraft:structuredClone(fixtureDraft),localVersions:['1.0.0']}}),
 preflightPluginDraft:async body=>{fixtureDrafts.push(structuredClone(body));return {manifest:{name:body.name,version:body.version},simulation:{order:[]},checks:[{label:'结构预检通过（隔离测试）'}]}},
 createPluginDraft:async body=>{fixtureCalls.push(['save',structuredClone(body)]);return{message:'隔离保存成功'}},
 hubConfig:()=>({environment:'development'})
};
