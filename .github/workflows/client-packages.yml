name: On-demand client packages
run-name: Client packages (${{ inputs.artifact_label }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      default_hub_url:
        description: Default Hub origin; leave empty to retain the AWS default
        type: string
        default: ''
      artifact_label:
        description: Download label only (for example cn); does not change application identity
        type: string
        default: custom
        required: true

permissions:
  contents: read

concurrency:
  group: client-packages-${{ github.ref }}-${{ inputs.artifact_label }}
  cancel-in-progress: false

env:
  PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
  GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
  SODUWORK_ARTIFACT_LABEL: ${{ inputs.artifact_label }}
  PYTHONUTF8: '1'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      label: ${{ steps.check.outputs.label }}
      default_hub_url: ${{ steps.check.outputs.default_hub_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate the requested build and existing publication gates
        id: check
        run: python tools/github/client_packages.py preflight
        env:
          GH_TOKEN: ${{ github.token }}
          SODUWORK_DEFAULT_HUB_URL: ${{ inputs.default_hub_url }}
      - name: Retain the published version's verified notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-package-inputs-${{ github.run_id }}
          path: release-evidence/published-notes/*
          if-no-files-found: error
          retention-days: 30

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  security:
    needs: preflight
    uses: ./.github/workflows/security.yml

  client:
    needs: [preflight, quality, security]
    environment: public-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: windows, os: windows-2022, arch: x64}
          - {shard: linux, os: ubuntu-22.04, arch: x64}
          - {shard: macos-arm64, os: macos-26, arch: arm64}
          - {shard: macos-x64, os: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SODUWORK_DEFAULT_HUB_URL: ${{ needs.preflight.outputs.default_hub_url }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Prepare Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 rpm gnupg libarchive-tools
      - name: Restore the same verified release notes for every platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-package-inputs-${{ github.run_id }}
          path: release-evidence/published-notes
      - name: Use TCP for Apple ticket downloads on Intel macOS
        if: matrix.shard == 'macos-x64'
        shell: bash
        run: |
          # GitHub-hosted Intel runners can drop Apple's HTTP/3 connections.
          # https://github.com/actions/runner-images/issues/14924
          # Apply the runner workaround before both stapling and validation.
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Prepare macOS signing and notarization
        if: startsWith(matrix.shard, 'macos-')
        run: bash tools/ci/prepare-macos-signing.sh
        env:
          SODUWORK_MAC_CERTIFICATE_B64: ${{ secrets.SODUWORK_MAC_CERTIFICATE_B64 }}
          SODUWORK_MAC_CERTIFICATE_PASSWORD: ${{ secrets.SODUWORK_MAC_CERTIFICATE_PASSWORD }}
          SODUWORK_MAC_KEYCHAIN_PASSWORD: ${{ secrets.SODUWORK_MAC_KEYCHAIN_PASSWORD }}
          SODUWORK_MAC_SIGN_IDENTITY: ${{ secrets.SODUWORK_MAC_SIGN_IDENTITY }}
          SODUWORK_MAC_NOTARY_KEY_ID: ${{ secrets.SODUWORK_MAC_NOTARY_KEY_ID }}
          SODUWORK_MAC_NOTARY_ISSUER: ${{ secrets.SODUWORK_MAC_NOTARY_ISSUER }}
          SODUWORK_MAC_NOTARY_PRIVATE_KEY_B64: ${{ secrets.SODUWORK_MAC_NOTARY_PRIVATE_KEY_B64 }}
          SODUWORK_MAC_NOTARY_PROFILE: ${{ secrets.SODUWORK_MAC_NOTARY_PROFILE }}
      - name: Build once and run native installation acceptance
        run: python tools/github/client_packages.py ${{ matrix.shard }} --output release-out/${{ matrix.shard }}
        env:
          SODUWORK_MAC_SIGN_IDENTITY: ${{ startsWith(matrix.shard, 'macos-') && secrets.SODUWORK_MAC_SIGN_IDENTITY || '' }}
          SODUWORK_LINUX_SIGNING_KEY_B64: ${{ matrix.shard == 'linux' && secrets.SODUWORK_LINUX_SIGNING_KEY_B64 || '' }}
          SODUWORK_LINUX_SIGNING_PASSPHRASE: ${{ matrix.shard == 'linux' && secrets.SODUWORK_LINUX_SIGNING_PASSPHRASE || '' }}
          SODUWORK_LINUX_SIGNING_FINGERPRINT: ${{ matrix.shard == 'linux' && vars.SODUWORK_LINUX_SIGNING_FINGERPRINT || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.label }}-${{ matrix.shard }}-${{ github.run_id }}
          path: release-out/${{ matrix.shard }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Clean up macOS signing material
        if: always() && startsWith(matrix.shard, 'macos-')
        run: bash tools/ci/cleanup-macos-signing.sh
      - name: Retain failed installation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.shard }}
          path: |
            release-evidence/**/*.log
            release-evidence/**/*.json
          if-no-files-found: ignore
          retention-days: 7
