name: Feature request / 功能建议
description: Describe a user problem and expected outcome / 描述使用场景和期望结果
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem / 用户问题
      description: Describe the workflow without company or customer information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Expected outcome / 期望结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope / 替代方式与范围
