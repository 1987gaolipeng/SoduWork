name: Feature request
description: Describe a user problem and expected outcome
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow without company or customer information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
