name: Bug report
description: Report a reproducible problem without private data
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow SECURITY.md and establish a private channel first.
  - type: input
    id: version
    attributes:
      label: Source version and platform
      placeholder: Commit or release, OS, Python and Node versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use isolated accounts and synthetic data; remove credentials and private addresses.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Do not attach databases, session profiles, tokens, or internal screenshots.
